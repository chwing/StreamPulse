connector.name=delta_lake

# Point Trino at MinIO using the same S3A settings as Spark
hive.metastore=file
hive.metastore.catalog.dir=s3a://streampulse-gold/

# MinIO S3A connection
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=streampulse
hive.s3.aws-secret-key=streampulse123
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false

# Delta Lake specific
delta.enable-non-concurrent-writes=false
delta.register-table-procedure.enabled=true
